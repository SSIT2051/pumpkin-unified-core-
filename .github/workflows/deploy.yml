name: Deploy to pumpkin-vm

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pumpkin-unified-core.so
      
      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PUMPKIN_VM_SSH_KEY }}
          SSH_HOST: ${{ secrets.PUMPKIN_VM_HOST }}
          SSH_USER: ${{ secrets.PUMPKIN_VM_USER }}
        run: |
          echo "$SSH_PRIVATE_KEY" > key.pem
          chmod 600 key.pem
          
          scp -i key.pem -o StrictHostKeyChecking=no libpumpkin_unified_core.so $SSH_USER@$SSH_HOST:/root/pumpkin-server/plugins/pumpkin-unified-core.so.new
          
          ssh -i key.pem -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'EOF'
            cd /root/pumpkin-server
            mv plugins/pumpkin-unified-core.so plugins/pumpkin-unified-core.so.$(date +%s).old 2>/dev/null || true
            mv plugins/pumpkin-unified-core.so.new plugins/pumpkin-unified-core.so
            sudo systemctl restart pumpkin
            sleep 10
            ./verify-plugin.sh
          EOF