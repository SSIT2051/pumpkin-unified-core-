[package]
name = "pumpkin-unified-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["SSIT2051"]
description = "Unified EssentialsX + LuckPerms plugin for PumpkinMC (WASM component)"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = "0.2.1"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = { version = "0.14", features = ["toml", "yaml"], default-features = false }
toml = "0.8"
serde_yaml = "0.9"
thiserror = "1.0"
fs2 = { version = "0.4", optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }
uuid = { version = "1.0", features = ["serde", "v4"], optional = true }
anyhow = "1.0"
tokio = { version = "1.54", features = ["sync", "macros", "io-util", "rt", "time"], default-features = false }
async-trait = "0.1"
regex = "1.10"
lazy_static = "1.4"
cron = "0.17"
tokio-cron-scheduler = { version = "0.15", default-features = false }
dashmap = "6.2"
chrono = { version = "0.4", features = ["std", "serde"] }

# sqlx, redis, and their tokio dependencies are NOT compatible with wasm32-wasip2
# They are only used for native builds (non-wasm targets)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "mysql", "postgres"], default-features = false }
redis = { version = "0.23", features = ["tokio-comp", "connection-manager"], default-features = false }

# Force tokio to use only WASM-compatible features for wasm32-wasip2 target
[target.wasm32-wasip2.dependencies]
tokio = { version = "1.54", features = ["sync", "macros", "io-util", "rt", "time"], default-features = false }
tokio-cron-scheduler = { version = "0.15", default-features = false }

[features]
default = []
sqlite = ["rusqlite"]
http = ["reqwest", "uuid"]
file-locking = ["fs2"]
signal = ["tokio/signal", "tokio-cron-scheduler/signal"]
cron-scheduler = ["tokio-cron-scheduler", "tokio/signal"]
full-sqlx = ["sqlx/any", "sqlx/mysql", "sqlx/postgres"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
